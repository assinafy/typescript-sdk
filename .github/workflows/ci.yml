name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast inner loop: typecheck, lint and unit tests under Bun.
  test:
    name: Test (bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-1.3.14-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:coverage
      - run: bun run audit
      - run: bun run build

  # The package ships dual CJS/ESM to Node consumers, but the `test` job runs
  # only under Bun. This job packs and installs the artifact, then imports it by
  # package name on every supported Node major. That exercises the real exports
  # map and both entrypoints rather than importing dist files directly.
  node-compat:
    name: Node ${{ matrix.node }} compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `engines.node` in package.json.
        # 22 = maintenance LTS, 24 = active LTS. Node 20 went EOL April 2026.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Install the packed SDK in an isolated consumer
        run: |
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/sdk-consumer"
          cd "${RUNNER_TEMP}/sdk-consumer"
          npm init --yes
          npm install "${RUNNER_TEMP}"/assinafy-sdk-*.tgz --ignore-scripts

      # Import the installed package the way real consumers do, on real Node.
      - name: Smoke-test the CommonJS build
        working-directory: ${{ runner.temp }}/sdk-consumer
        run: |
          node -e "
            const sdk = require('@assinafy/sdk');
            const missing = ['AssinafyClient', 'WebhookVerifier', 'ApiError', 'ValidationError']
              .filter((n) => typeof sdk[n] !== 'function');
            if (missing.length) throw new Error('CJS build missing exports: ' + missing.join(', '));
            new sdk.AssinafyClient({ apiKey: 'k', accountId: 'a' });
            console.log('CJS build OK on Node ' + process.version);
          "

      - name: Smoke-test the ESM build
        working-directory: ${{ runner.temp }}/sdk-consumer
        run: |
          node --input-type=module -e "
            import { AssinafyClient, WebhookVerifier } from '@assinafy/sdk';
            if (typeof AssinafyClient !== 'function' || typeof WebhookVerifier !== 'function') {
              throw new Error('ESM build is missing expected exports');
            }
            new AssinafyClient({ apiKey: 'k', accountId: 'a' });
            console.log('ESM build OK on Node ' + process.version);
          "

  # Validate what actually gets published: exports map, types resolution and
  # CJS/ESM interop across consumer moduleResolution modes.
  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      # publint + attw, pinned via devDependencies rather than @latest so a
      # tool release cannot break the build unannounced.
      - run: bun run lint:pkg
