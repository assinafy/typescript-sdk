name: Release

# GitLab is canonical and mirrors tags to GitHub. A tag push is therefore the
# reliable release signal; GitHub `release` events are not created by mirroring.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize every repository release. Per-ref groups would allow two versions
# to publish concurrently and race registry state.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify package version matches tag
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json version ($pkg) does not match release tag ($tag)"
            exit 1
          fi
          echo "Packaging version $pkg"

      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run audit
      - name: Create the immutable registry artifact
        run: |
          npm pack --ignore-scripts
          shasum -a 256 ./*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            ./*.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    name: Publish to npmjs.com
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance / trusted-publisher OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: shasum -a 256 -c SHA256SUMS
      # npm 11.5.1+ exchanges GitHub's short-lived OIDC identity for publish
      # credentials. Configure `release.yml` as this package's trusted publisher
      # on npmjs.com; no long-lived NPM_TOKEN is stored in GitHub.
      - run: npm publish ./*.tgz --access public

  publish-gh:
    name: Publish the same artifact to GitHub Packages
    needs: [package, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false
      - run: shasum -a 256 -c SHA256SUMS
      - run: npm publish ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
