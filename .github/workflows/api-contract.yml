name: API contract drift

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.repository }}
  cancel-in-progress: true

jobs:
  audit:
    name: Validate coverage ledger and exports against current OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `bun-version`: setup-bun v2 reads package.json's `packageManager`
      # field, keeping the pinned Bun version in one place.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run audit:api
