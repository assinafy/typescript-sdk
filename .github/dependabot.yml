# Dependabot keeps the SHA-pinned GitHub Actions and Bun dependencies current.
# Pinning actions to a commit SHA is the supply-chain hardening step; Dependabot
# is its complement — it opens PRs that bump the pin (updating the trailing
# `# vX` comment too) so pinned actions don't silently rot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native (Go) rewrite. Its package exports only
      # `{version, versionMajorMinor}` from `typescript` — the JS compiler API
      # (`ts.sys`, `ts.createProgram`, …) moved to `typescript/unstable/*` with a
      # different shape. Nothing in this toolchain reads that yet:
      #   - tsup --dts → rollup-plugin-dts crashes on `ts.sys.useCaseSensitiveFileNames`
      #   - typescript-eslint peer range is >=4.8.4 <6.1.0
      # Drop this ignore once both support the TS 7 API, then bump deliberately.
      - dependency-name: typescript
        versions: ['>=7']
