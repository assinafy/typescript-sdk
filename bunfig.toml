[test]
# Keep production-source coverage from silently regressing. Bun reports line and
# function coverage for this SDK; test files themselves are excluded.
coverageSkipTestFiles = true
# Enforce the floor independently for every covered production-source file.
# Bun includes implicit derived constructors in per-file function counts.
coverageThreshold = { lines = 0.98, functions = 0.90 }
